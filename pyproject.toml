[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-autoapp"
version = "2.0.0"
description = "Auto-generate Django apps with full CRUD boilerplate — models, views, URLs, forms, admin, and templates."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Dhiraj Jadav", email = "jadavdhiraj020@gmail.com"},
]
keywords = ["django", "boilerplate", "code-generator", "crud", "scaffolding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "Django>=4.2",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
api = ["djangorestframework>=3.14"]

[project.scripts]
django-autoapp-init = "django_autoapp.cli:main"

[project.urls]
Homepage = "https://github.com/dhirajjadav/django-autoapp"
Repository = "https://github.com/dhirajjadav/django-autoapp"
Issues = "https://github.com/dhirajjadav/django-autoapp/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["django_autoapp*"]

[tool.setuptools.package-data]
django_autoapp = ["templates/**/*.j2"]
